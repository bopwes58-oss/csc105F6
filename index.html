<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item Filter Assignment</title>
  <link rel="stylesheet" href="HW8.css" />
</head>
<body>
  <main class="container">
    <h1>Book & Resource Directory</h1>
    <p class="subtitle">Type a keyword below and click Search to filter the list.</p>

    <div class="search-controls">
      <input
        type="text"
        id="search-input"
        placeholder="Search items..."
        aria-label="Search items"
      />
      <button id="search-btn" type="button">Search</button>
    </div>

    <!-- Sub-elements will be added here via JavaScript when the page loads -->
    <ul id="item-list"></ul>
  </main>

  <script src="HW8.js"></script>
</body>
</html>
